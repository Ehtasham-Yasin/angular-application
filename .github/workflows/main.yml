name: Build my angular app

on:
  push:
    branches:
      - main

jobs:
  build-angular-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup Node JS
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build
          
       

   
